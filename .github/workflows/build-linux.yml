name: Build Aegisub Linux (AppImage & DEB)

on:
  push:
    branches:
      - main
      - master
      - feature
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
      - feature
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Packages (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git for HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global url."https://github.com/sekrit-twc/".insteadOf "https://bitbucket.org/the-sekrit-twc/"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson
        run: |
          python -m pip install --upgrade pip setuptools
          pip install meson==1.7.2

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            build-essential \
            libx11-dev \
            libwxgtk3.2-dev \
            libfreetype6-dev \
            pkg-config \
            libfontconfig1-dev \
            libass-dev \
            libasound2-dev \
            libffms2-dev \
            intltool \
            libboost-all-dev \
            libhunspell-dev \
            libuchardet-dev \
            libpulse-dev \
            libopenal-dev \
            libxxhash-dev \
            nasm \
            desktop-file-utils \
            curl \
            sed

      - name: Build Debian (.deb) Package
        run: |
          chmod +x ./build_deb.sh
          ./build_deb.sh

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegisub-Linux-DEB
          path: "*.deb"
          if-no-files-found: error
